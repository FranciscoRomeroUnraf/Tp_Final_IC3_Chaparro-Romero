version: '3.8'
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mqtt_broker_ic3
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log
    restart: unless-stopped